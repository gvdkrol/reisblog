<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rondjewereld.nl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/png" href="./src/img/favicon.png" />
  </head>
  <body>
    <div class="wrap">
      <div class="site-top">
        <header class="site-header" id="site-header"></header>
        <div class="search" id="search" role="search">
          <input type="search" id="search-input" placeholder="Zoek in alle verhalen…" aria-label="Zoek in alle verhalen" autocomplete="off" />
          <div class="search-results" id="search-results" hidden></div>
        </div>
      </div>
      <div class="kpis" id="kpis"></div>

      <main>
        <div class="decades" id="decades" aria-label="Filter op periode"></div>
        <div id="overview-map" class="overview-map"></div>
        <div class="filter-buttons" id="continents" aria-label="Filter op continent"></div>
        <p class="trip-count" id="trip-count"></p>
        <div id="trips" class="trip-grid"></div>
        <section id="links" hidden></section>
      </main>

      <footer class="site-footer" id="site-footer"></footer>
    </div>
    <script type="module" src="/src/overview.js"></script>
  </body>
</html>
